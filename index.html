<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroQuest - RPG Water Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    
    body {
      font-family: 'VT323', monospace;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    /* Retro Pixel UI Borders */
    .pixel-box {
      border: 4px solid #38bdf8;
      background: #1e293b;
      box-shadow: 6px 6px 0px #0284c7;
    }

    .pixel-box-gold {
      border: 4px solid #f59e0b;
      background: #1e293b;
      box-shadow: 6px 6px 0px #d97706;
    }

    .pixel-btn {
      border: 3px solid #ffffff;
      background: #0284c7;
      color: #ffffff;
      box-shadow: 4px 4px 0px #000000;
      transition: all 0.1s;
    }

    .pixel-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #000000;
    }

    .pixel-bar {
      border: 2px solid #ffffff;
      background: #000000;
      padding: 2px;
    }

    /* Pixelated Toast */
    @keyframes pixelSlide {
      from { transform: translateY(100%) translateX(-50%); opacity: 0; }
      to { transform: translateY(0) translateX(-50%); opacity: 1; }
    }
    .toast-anim {
      animation: pixelSlide 0.2s steps(4) forwards;
    }
  </style>
</head>
<body class="min-h-screen p-4 max-w-md mx-auto flex flex-col justify-between pb-8">

  <!-- Toast Alert -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden toast-anim">
    <div class="bg-amber-400 text-slate-950 font-bold px-6 py-2 border-4 border-black box-shadow shadow-[4px_4px_0px_#000] flex items-center gap-2 text-xl">
      <i class="fa-solid fa-trophy"></i>
      <span id="toast-message">QUEST COMPLETE!</span>
    </div>
  </div>

  <div class="space-y-5">
    
    <!-- Player Stats Header -->
    <header class="pixel-box p-4 space-y-2">
      <div class="flex justify-between items-center text-2xl">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-shield-halved text-cyan-400"></i>
          <span class="text-cyan-300 font-bold">HERO STATS</span>
        </div>
        <span id="player-level" class="text-amber-400 font-bold">LVL 1</span>
      </div>

      <!-- Health Hearts -->
      <div class="flex items-center justify-between pt-1">
        <span class="text-sm text-slate-400">HP (HYDRATION):</span>
        <div id="hearts-container" class="flex gap-1 text-red-500 text-lg">
          <i class="fa-regular fa-heart"></i>
          <i class="fa-regular fa-heart"></i>
          <i class="fa-regular fa-heart"></i>
          <i class="fa-regular fa-heart"></i>
          <i class="fa-regular fa-heart"></i>
        </div>
      </div>

      <!-- XP Bar -->
      <div class="space-y-1">
        <div class="flex justify-between text-xs text-slate-400">
          <span>EXP POINTS</span>
          <span id="xp-text">0 / 500 XP</span>
        </div>
        <div class="pixel-bar">
          <div id="xp-bar" class="bg-amber-400 h-3 transition-all duration-300" style="width: 0%;"></div>
        </div>
      </div>
    </header>

    <!-- Main Quest Card -->
    <section class="pixel-box p-5 text-center space-y-4">
      <div class="text-cyan-300 text-xl font-bold tracking-wider">[ DAILY WATER QUEST ]</div>

      <!-- Main Water Gauge -->
      <div class="py-2">
        <div id="current-intake" class="text-5xl font-extrabold text-white tracking-wider">0 ML</div>
        <div class="text-sm text-slate-400 mt-1">TARGET: <span id="target-intake">2500</span> ML</div>
      </div>

      <!-- Pixelated Progress Bar -->
      <div class="pixel-bar">
        <div id="water-bar" class="bg-cyan-400 h-7 transition-all duration-500 flex items-center justify-center text-xs font-bold text-slate-950" style="width: 0%;">
          <span id="percentage-text">0%</span>
        </div>
      </div>
    </section>

    <!-- Item Inventory (Quick Log) -->
    <section class="space-y-2">
      <div class="text-sm text-slate-400 font-bold px-1">> USE POTIONS (QUICK LOG)</div>
      <div class="grid grid-cols-3 gap-3">
        <button onclick="logWater(250)" class="pixel-btn p-3 text-center">
          <i class="fa-solid fa-flask text-cyan-300 text-xl block mb-1"></i>
          <span class="text-lg font-bold">+250 ML</span>
          <span class="text-xs block text-cyan-100">Small Potion</span>
        </button>
        <button onclick="logWater(500)" class="pixel-btn p-3 text-center">
          <i class="fa-solid fa-[#ffffff] fa-wine-bottle text-amber-300 text-xl block mb-1"></i>
          <span class="text-lg font-bold">+500 ML</span>
          <span class="text-xs block text-cyan-100">Elixir Bottle</span>
        </button>
        <button onclick="logWater(750)" class="pixel-btn p-3 text-center">
          <i class="fa-solid fa-jar text-emerald-300 text-xl block mb-1"></i>
          <span class="text-lg font-bold">+750 ML</span>
          <span class="text-xs block text-cyan-100">Mega Jug</span>
        </button>
      </div>

      <!-- Custom ML Input -->
      <div class="pixel-box p-2 flex items-center gap-2">
        <input type="number" id="custom-ml" placeholder="Custom XP / ML..." class="bg-transparent px-2 py-1 text-lg focus:outline-none w-full text-white placeholder-slate-500">
        <button onclick="logCustomWater()" class="pixel-btn px-4 py-1 text-lg font-bold whitespace-nowrap">
          + DRINK
        </button>
      </div>
    </section>

    <!-- Achievements Section -->
    <section class="pixel-box p-4 space-y-3">
      <div class="text-amber-400 text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-medal"></i>
        <span>QUEST ACHIEVEMENTS</span>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-xs">
        <div id="badge-1" class="border-2 border-slate-700 p-2 opacity-40">
          <i class="fa-solid fa-droplet text-lg block mb-1 text-cyan-400"></i>
          <span>First Sip</span>
        </div>
        <div id="badge-2" class="border-2 border-slate-700 p-2 opacity-40">
          <i class="fa-solid fa-shield text-lg block mb-1 text-amber-400"></i>
          <span>Halfway Hero</span>
        </div>
        <div id="badge-3" class="border-2 border-slate-700 p-2 opacity-40">
          <i class="fa-solid fa-crown text-lg block mb-1 text-yellow-400"></i>
          <span>Hydration King</span>
        </div>
      </div>
    </section>

    <!-- NFC Tag Generator Tool -->
    <section class="pixel-box-gold p-4 space-y-3">
      <div class="text-amber-400 text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>NFC TAG URL SPELL</span>
      </div>
      <div class="space-y-2 text-xs">
        <div>
          <label class="text-slate-400 block mb-1">Target ML per NFC Tap:</label>
          <input type="number" id="nfc-ml" value="500" oninput="updateNfcUrl()" class="w-full bg-black border border-amber-500 p-2 text-amber-300 font-mono">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Generated URL for NFC Tools:</label>
          <div class="flex gap-2">
            <input type="text" id="nfc-output" readonly class="w-full bg-black border border-slate-600 p-2 text-slate-300 font-mono">
            <button onclick="copyNfcUrl()" class="pixel-btn px-3 py-1 font-bold whitespace-nowrap">COPY</button>
          </div>
        </div>
      </div>
    </section>

    <!-- History Logs -->
    <section class="pixel-box p-4 space-y-2">
      <div class="flex justify-between items-center text-sm">
        <span class="text-slate-300 font-bold">> BATTLE LOGS (TODAY)</span>
        <button onclick="clearTodayHistory()" class="text-xs text-red-400 hover:underline">RESET</button>
      </div>
      <div id="history-list" class="space-y-1 text-xs max-h-36 overflow-y-auto font-mono">
        <p class="text-slate-500 text-center py-2">No quest logs recorded today.</p>
      </div>
    </section>

  </div>

  <script>
    let goal = 2500;
    let logs = JSON.parse(localStorage.getItem('rpgWaterLogs')) || [];

    // Chiptune Sound Generator (Web Audio API)
    function playRetroSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';

        if (type === 'log') {
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'levelup') {
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(800, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch (e) { console.log(e); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Auto-Detect NFC parameters
      const params = new URLSearchParams(window.location.search);
      const mlParam = params.get('ml');
      if (mlParam) {
        logWater(parseInt(mlParam), 'NFC Spell Tap');
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        render();
      }

      updateNfcUrl();
    });

    function getTodayTotal() {
      const today = new Date().toDateString();
      return logs.filter(l => new Date(l.t).toDateString() === today).reduce((sum, l) => sum + l.a, 0);
    }

    function render() {
      const total = getTodayTotal();
      document.getElementById('current-intake').innerText = total + ' ML';

      // Percentage and Progress Bar
      const pct = Math.min(Math.round((total / goal) * 100), 100);
      document.getElementById('water-bar').style.width = pct + '%';
      document.getElementById('percentage-text').innerText = pct + '%';

      // Level & XP Logic (1 ml = 1 XP, Level up every 500 XP)
      const level = Math.floor(total / 500) + 1;
      const currentLevelXp = total % 500;
      document.getElementById('player-level').innerText = 'LVL ' + level;
      document.getElementById('xp-text').innerText = `${currentLevelXp} / 500 XP`;
      document.getElementById('xp-bar').style.width = `${(currentLevelXp / 500) * 100}%`;

      // Hearts Container (5 Hearts max)
      const heartCount = Math.min(Math.floor((total / goal) * 5), 5);
      const heartsContainer = document.getElementById('hearts-container');
      let heartsHtml = '';
      for (let i = 0; i < 5; i++) {
        if (i < heartCount) {
          heartsHtml += '<i class="fa-solid fa-heart text-red-500"></i>';
        } else {
          heartsHtml += '<i class="fa-regular fa-heart text-slate-600"></i>';
        }
      }
      heartsContainer.innerHTML = heartsHtml;

      // Badges
      if (total >= 250) document.getElementById('badge-1').className = 'border-2 border-cyan-400 p-2 bg-cyan-950/40';
      if (total >= 1250) document.getElementById('badge-2').className = 'border-2 border-amber-400 p-2 bg-amber-950/40';
      if (total >= 2500) document.getElementById('badge-3').className = 'border-2 border-yellow-400 p-2 bg-yellow-950/40';

      renderLogs();
    }

    function renderLogs() {
      const container = document.getElementById('history-list');
      const today = new Date().toDateString();
      const todayLogs = logs.filter(l => new Date(l.t).toDateString() === today).reverse();

      if (todayLogs.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-center py-2">No quest logs recorded today.</p>';
        return;
      }

      container.innerHTML = todayLogs.map(l => {
        const time = new Date(l.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `<div class="flex justify-between border-b border-slate-800 py-1">
          <span class="text-cyan-300">+${l.a} ML (${l.source})</span>
          <span class="text-slate-500">${time}</span>
        </div>`;
      }).join('');
    }

    function logWater(amount, source = 'Potion') {
      logs.push({ a: amount, t: new Date(), source });
      localStorage.setItem('rpgWaterLogs', JSON.stringify(logs));
      
      playRetroSound('log');
      showToast(`+${amount} XP RECOVERY!`);
      render();

      if (getTodayTotal() >= goal) {
        playRetroSound('levelup');
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }

    function logCustomWater() {
      const input = document.getElementById('custom-ml');
      const amount = parseInt(input.value);
      if (!isNaN(amount) && amount > 0) {
        logWater(amount, 'Custom Spell');
        input.value = '';
      }
    }

    function clearTodayHistory() {
      const today = new Date().toDateString();
      logs = logs.filter(l => new Date(l.t).toDateString() !== today);
      localStorage.setItem('rpgWaterLogs', JSON.stringify(logs));
      render();
      showToast('QUEST REBOOTED!');
    }

    function updateNfcUrl() {
      const ml = document.getElementById('nfc-ml').value || '500';
      const baseUrl = window.location.origin + window.location.pathname;
      document.getElementById('nfc-output').value = `${baseUrl}?ml=${ml}`;
    }

    function copyNfcUrl() {
      const output = document.getElementById('nfc-output');
      output.select();
      navigator.clipboard.writeText(output.value);
      showToast('SPELL URL COPIED!');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2000);
    }
  </script>
</body>
</html>
